# Sample schema: groups may adapt key names, documenting any changes.
# Teacher's invalid example: days = 0 must be rejected before simulation.
[files]
products = "products.csv"
historical_sales = "historical_sales.csv"
database = "../output/inventory.sqlite"
output_directory = "../output"

[simulation]
days = 0
seed = 2026
currency = "EUR"

[demand]
model = "poisson"
mean_source = "historical_daily_mean"

[costs]
holding_per_unit_per_day = 0.02
fixed_per_product_order = 1.00

# Shared defaults for all products; per-product overrides are optional designs.
[policies.fixed_quantity]
threshold = 20
quantity = 40

[policies.order_up_to]
threshold = 20
target = 60

[extension]
selected = ""
